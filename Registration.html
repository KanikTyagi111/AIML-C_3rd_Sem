<!DOCTYPE html>
<html lang="en">
<body>

    
    <button onclick="togglePopup(true)">Register</button>

    
    <div id="popup" style="display: none; position: fixed; top: 25%; left: 35%; background: lightgray; padding: 20px; border: 2px solid black;">
        <h3>Sign Up</h3>
        <form id="regForm" onsubmit="validateForm(event)">
            <input type="text" id="name" placeholder="Name" required><br><br>
            <input type="email" id="email" placeholder="Email" required><br><br>
            
            
            <input type="tel" id="mobile" placeholder="Mobile (10 digits)" required><br><br>
            
            <input type="password" id="pass" placeholder="Password" required><br><br>
            <input type="password" id="repass" placeholder="Re-enter Password" required><br><br>
            
            <button type="submit">Submit</button>
            <button type="button" onclick="togglePopup(false)">Cancel</button>
        </form>
    </div>

    
    <script>
        function togglePopup(show) {
            document.getElementById('popup').style.display = show ? 'block' : 'none';
        }

        function validateForm(event) {
            event.preventDefault(); 
            
            let mobile = document.getElementById('mobile').value;
            let pass = document.getElementById('pass').value;
            let repass = document.getElementById('repass').value;

            
            if (mobile.length !== 10 || isNaN(mobile)) {
                alert("गलत नंबर! कृपया 10 अंकों का सही मोबाइल नंबर डालें।");
                return;
            }

           
            if (pass !== repass) {
                alert("पासवर्ड मैच नहीं हो रहा है!");
                return;
            }

            
            alert("रजिस्ट्रेशन सफल रहा!");
            document.getElementById('regForm').reset();
            togglePopup(false);
        }
    </script>

</body>
</html>
