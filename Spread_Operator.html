<!-- 1. Used for two array concatination -->



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let data = [10,20,30,40];

        function sum(...args) {
            let sum = 0;
            for(let i of args) {
                sum += i;
            }
            console.log(sum);
        }

        sum(...data);

        let a = [10,20,30];
        let b = [40,50,60];

        let c = [...a,...b];  // or c = a.concat(b);
        console.log(c);

    </script>
    
</body>
</html>
